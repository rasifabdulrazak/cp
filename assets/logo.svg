<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 80" fill="none">
  <!-- 
    Refined Logo based on 'Teal/Gold Pillars' reference
    Layout: Horizontal for Navbar usage (Icon Left, Text Right)
    Colors: Teal (#008B99), Gold/Beige (#C5A065)
  -->
  <defs>
    <style>
      .teal { fill: #0097A7; }
      .gold { fill: #C5A065; }
      .text-main { fill: #0097A7; font-family: 'Oswald', sans-serif; font-weight: 700; }
      .text-sub { fill: #C5A065; font-family: 'Inter', sans-serif; font-weight: 500; text-transform: uppercase; }
    </style>
  </defs>

  <!-- ICON SECTION (x: 0-70) -->
  <!-- Left Gold Pillar (Perspective) -->
  <path class="gold" d="M10 35 L 25 30 L 25 70 L 10 65 Z" />
  
  <!-- Right Teal Arch/Pillars -->
  <!-- Main tall pillar with curved top -->
  <path class="teal" d="M30 10 Q 50 5, 65 20 L 65 70 L 55 70 L 55 25 Q 45 15, 38 20 L 38 70 L 30 70 Z" />

  <!-- TEXT SECTION (x: 80+) -->
  <!-- Main Title -->
  <text x="80" y="48" class="text-main" font-size="38" letter-spacing="1">C-PORTALS</text>
  
  <!-- Subtitle -->
  <text x="82" y="68" class="text-sub" font-size="11" letter-spacing="2">ENGINEERING SOLUTIONS</text>
</svg>
